[project]
name = "lunch-recommend-backend"
version = "0.1.0"
description = "Slack lunch recommendation bot MVP backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "mypy>=1.10,<2",
    "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "contract: PRD/test-spec contract checks for the Slack lunch bot MVP",
    "security: Slack/security/no-secret-leakage checks",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
exclude = [".venv"]

[[tool.mypy.overrides]]
module = ["fastapi.*", "httpx.*"]
ignore_missing_imports = true
